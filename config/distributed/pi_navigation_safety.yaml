# pi_navigation_safety.yaml — PI-3 runtime profile (192.168.10.13).
#
# Owns ALL physical motion authority. This is the only Pi allowed to
# actuate motors/servos, and the only Pi allowed to approve or reject a
# movement proposal from Pi-1 or Pi-2. See
# docs/DISTRIBUTED_TOPIC_SERVICE_CONTRACT.md and
# docs/INTER_PI_COMMUNICATION_POLICY.md for the full authority chain.
#
# NOTE (Phase 1 audit finding, updated Phase 6): bonbon_motor_cytron_mdds30
# is now implemented as bonbon_hal's CytronMDDS30Driver + motor_node
# (raw hardware I/O, same HAL-centralization pattern as every other Pi-3
# physical device), and bonbon_base_controller (kinematics/odometry
# policy layer) is a new package. bonbon_stepper_controller is still NOT
# implemented — see docs/HARDWARE_SOFTWARE_GAP_REPORT.md item 2 (severity
# pending clarification of which joint(s), if any, the steppers drive).
# Neither the Cytron driver nor bonbon_base_controller has been run
# against real hardware yet -- mock/open-loop-estimate only until Pi-3
# hardware bring-up confirms wheel_base_m and whether wheel encoders exist.

pi_role: navigation_safety
static_ip: 192.168.10.13

packages:
  - bonbon_navigation_bringup
  - bonbon_lidar_rplidar
  - bonbon_hal                    # owns CytronMDDS30Driver + motor_node (raw I/O)
  - bonbon_base_controller        # diff-drive kinematics + odometry (policy layer)
  - bonbon_stepper_controller     # NOT YET IMPLEMENTED — see gap report item 2
  - bonbon_servo_controller       # = existing bonbon_hal servo_node (Dynamixel)
  - bonbon_motion_safety
  - bonbon_safety_supervisor      # = existing bonbon_safety
  - bonbon_navigation_monitor

# NOTE (2026-07-06): this list predates the actual per-Pi systemd units in
# deployment/systemd/pi3/ and names one unit per HAL device (lidar/servo/
# motor/stepper separately); the real units bundle all of bonbon_hal's
# Pi-3 devices into a single bonbon-pi3-hal.service, since bonbon_hal's
# launch file already gives each device its own ROS2 node process with
# its own respawn -- a separate systemd unit/container per device buys
# nothing extra. Also: bonbon-stepper-controller.service is no longer
# "blocked until stepper driver exists" -- the NEMA17 driver was built
# 2026-07-06 (see HARDWARE_SOFTWARE_GAP_REPORT.md item 2, resolved). The
# real list, matching deployment/compose/docker-compose.pi3.yml:
#   bonbon-pi3-safety.service              (starts FIRST, before any actuation)
#   bonbon-pi3-hal.service                 (lidar+motor+servo+stepper+estop+imu+battery)
#   bonbon-pi3-base-controller.service
#   bonbon-pi3-actuation.service
#   bonbon-pi3-motion-gateway.service
#   bonbon-pi3-navigation.service
#   bonbon-pi3-distributed-liveness.service
# The list below is kept for historical/planning context, not as the
# literal deployment target -- see deployment/systemd/pi3/*.service.
systemd_services:
  - bonbon-safety-supervisor.service    # starts FIRST, before any actuation
  - bonbon-lidar.service
  - bonbon-servo-controller.service
  - bonbon-motor.service                # bonbon_hal motor_node (Cytron MDDS30)
  - bonbon-base-controller.service
  - bonbon-stepper-controller.service   # RESOLVED 2026-07-06 -- see note above
  - bonbon-navigation.service
  - bonbon-motion-safety.service
  - bonbon-navigation-monitor.service

# Subset of config/pi_efficiency_profile.yaml relevant to Pi-3 — every
# safety-critical (never-shed) module lives here, plus navigation.
relevant_efficiency_modules:
  - safety_supervisor
  - emergency_stop
  - hal
  - lidar_obstacle_safety
  - navigation_safety
  - active_person_tracking     # proximity input only; full tracking runs on Pi-2

remote_dependencies:
  reads_from_pi1:
    - /bonbon/operator/proposal
  reads_from_pi2:
    - /bonbon/behavior/proposal
    - /bonbon/human_state/active   # secondary safety signal (see Phase 6 wiring)
  publishes:
    - /bonbon/safety/state
    - /bonbon/safety/approval
    - /bonbon/safety/rejection
    - /bonbon/motion/approved_command
    - /bonbon/motion/status
    - /bonbon/navigation/status

authority:
  # Pi-3's safety supervisor is the ONLY node anywhere in the fleet allowed
  # to publish /bonbon/motion/approved_command. This is enforced by
  # bonbon_motion_approval_gateway (Phase 3) and checked at deployment time
  # by scripts/check_inter_pi_communication.py (Phase 8).
  sole_motion_command_publisher: bonbon_safety_supervisor
  actuation_starts_disabled: true   # actuation is enabled only after safety confirms sensor readiness

forbidden:
  - accepting_raw_string_commands_from_other_pis   # typed proposals only
  - bypassing_safety_validation_for_any_source      # including operator/dashboard

boot_order:
  1: bonbon-safety-supervisor.service   # must be up before ANY actuation node starts
  2: bonbon-lidar.service
  3: bonbon-servo-controller.service    # actuation starts DISABLED until safety confirms
  4: bonbon-motor.service               # also starts DISABLED (motor_node emergency-stops on deactivate)
  5: bonbon-base-controller.service
  6: bonbon-stepper-controller.service
  7: bonbon-navigation.service
  8: bonbon-motion-safety.service
  9: bonbon-navigation-monitor.service
