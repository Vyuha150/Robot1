    dashboard_visible: true
    enabled_by_default: true
    languages: ["n/a"]
    notes: "HARDWARE_BLOCKED -- MediaPipe's own pose landmarks (part of Holistic, already real) are the working pose_estimation path today; this entry exists for when/if Hailo acceleration is benchmarked as worthwhile. enabled_by_default flipped true (18-point edge-AI verification, check 1) -- pose_estimation had only this one entry and no registered default, so FallbackPolicy.resolve() never even attempted the real, working gesture_mediapipe_holistic fallback; the capability had zero working path at all."

