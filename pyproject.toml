[project]
name = "bonbon-robot-ai"
version = "1.0.0"
description = "BonBon AI service robot — ROS2 software stack"
# Pinned to the actual deployment runtime: every Pi's ROS2 container is
# built FROM ros:humble-ros-base-jammy, which ships Python 3.10 -- ROS2
# Humble has no official Ubuntu 22.04/Python 3.11 image. This was
# previously set to >=3.11 with no corresponding runtime that actually
# provides it, and went undetected until a real Pi-2 deployment build
# crashed on `from enum import StrEnum` (3.11+ only) across 21 files
# repo-wide. Do not raise this without also changing every Pi's base
# container image.
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.py$'
extend-exclude = '''
/(build|install|log|\.venv|\.git|founder_command_center)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
# founder_command_center is a separate, unrelated project (an AI Founder
# Command Center for personal/business use) that happens to live in this
# repository — it is not BonBon robot software and should not be subject to
# this codebase's lint/format/type gates.
exclude = ["build", "install", "log", ".venv", "founder_command_center"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — handled by black
    "E702",   # multiple statements on one line (semicolon) — intentional in hardware/test helpers
    "E701",   # multiple statements on one line (colon) — intentional in concise guards
    "B008",   # FastAPI Depends() / require_permission() in argument defaults — standard FastAPI pattern
    "E402",   # module-level import not at top — required by test setup and ROS2 stub injection
    "B905",   # zip() without strict= — Python 3.11 compat, not always needed
    "SIM",    # SIM rules off — too opinionated for embedded / ROS2 style code
    # Typing-modernization rules (List[X] -> list[X], Optional[X] -> X | None,
    # quoted annotations). Left off deliberately: this codebase predates
    # adopting PEP 585/604 syntax throughout, the change is purely cosmetic
    # (Python 3.11 supports both forms identically), and a prior blanket
    # `ruff --fix` pass across these rules swept unrelated typing-style
    # changes into large, actively-developed shared files and had to be
    # reverted. Re-enable per-file as files are touched for other reasons,
    # not via a repo-wide sweep.
    "UP006",  # non-pep585-annotation
    "UP035",  # deprecated-import (typing.List/Dict/Optional etc.)
    "UP037",  # quoted-annotation
    "UP045",  # non-pep604-annotation-optional
]

[tool.ruff.lint.per-file-ignores]
# Hardware drivers: optional hardware imports inside try/except blocks
"ros2_ws/src/bonbon_hal/**" = ["F401"]
"ros2_ws/src/bonbon_vision/tests/**" = ["F401"]
"ros2_ws/src/bonbon_perception/**" = ["F401"]
"ros2_ws/src/bonbon_operator_api/bonbon_operator_api/metrics/**" = ["F401"]
"ros2_ws/src/bonbon_operator_api/bonbon_operator_api/ros2/**" = ["F401"]
# Abstract base classes with intentional no-op optional methods (not pure abstract)
"ros2_ws/src/bonbon_tts/bonbon_tts/backends/base_tts.py" = ["B027"]
"ros2_ws/src/bonbon_tts/bonbon_tts/speaker/speaker_bridge.py" = ["B027"]
"ros2_ws/src/bonbon_vision/bonbon_vision/detectors/base_detector.py" = ["B027"]
# Tests: blind exception catching is acceptable for validation smoke tests
"ros2_ws/src/bonbon_data_stores/tests/**" = ["B017"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
exclude = "(build|install|log|\\.venv)"
# devops/ and ros2_ws/src/bonbon_simulation/ are unrelated package trees
# checked in one invocation (see .github/workflows/ci.yml); both have their
# own tests/conftest.py with no __init__.py chain tying them to a common
# root, so without this mypy collapses them to the same "conftest" module
# and refuses to proceed. explicit_package_bases tells mypy to resolve each
# path's package identity independently instead of assuming a single shared
# namespace.
explicit_package_bases = true

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/benchmarks/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# CI enforces >= 80% on the reliability/performance cores (see .github/workflows/ci.yml).

