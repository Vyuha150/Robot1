[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; Local (non-colcon-built) test runs need bonbon_behavior_engine and
; bonbon_perception_efficiency on sys.path directly, since
; FocusPublishGate reuses select_focus_person() and ActivePersonFocusManager
; rather than duplicating them. Under a real colcon build all packages are
; installed into the same environment and this is redundant but harmless.
pythonpath = . ../bonbon_behavior_engine ../bonbon_perception_efficiency
