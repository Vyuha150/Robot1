[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; Local (non-colcon-built) test runs need bonbon_perception_efficiency on
; sys.path directly, since affective_ai_node reuses its BoundedInferenceQueue
; rather than duplicating it. Under a real colcon build both packages are
; installed into the same environment and this is redundant but harmless.
pythonpath = . ../bonbon_perception_efficiency
