# hal_params.yaml
# Runtime parameters for all BonBon HAL hardware nodes.
# Set driver_mode: "real" on hardware; "mock" for simulation / CI.
#
# DO NOT change hardware port paths without a corresponding physical audit.
# Override per deployment with a second YAML in the launch file.

# ── Camera node (Orbbec Astra Mini) ──────────────────────────────────────────
camera_node:
  ros__parameters:
    driver_mode:   "mock"      # "real" | "mock"
    data_rate_hz:  30.0
    width:         640
    height:        480
    fps:           30
    frame_id_color: "camera_color_optical_frame"
    frame_id_depth: "camera_depth_optical_frame"
    reconnect_max_attempts:   5
    reconnect_base_delay_sec: 1.0
    reconnect_max_delay_sec:  30.0

# ── LIDAR node (RPLIDAR S2) ───────────────────────────────────────────────────
lidar_node:
  ros__parameters:
    driver_mode:   "mock"
    data_rate_hz:  10.0
    port:          "/dev/ttyUSB0"
    baudrate:      115200
    reconnect_max_attempts:   5
    reconnect_base_delay_sec: 1.0
    reconnect_max_delay_sec:  30.0

# ── IMU node (MPU-6050) ───────────────────────────────────────────────────────
imu_node:
  ros__parameters:
    driver_mode:   "mock"
    data_rate_hz:  100.0
    i2c_bus:       1
    i2c_addr:      0x68       # AD0 = GND
    frame_id:      "imu_link"
    run_calibration: false    # set true on first deploy
    reconnect_max_attempts:   5
    reconnect_base_delay_sec: 0.5
    reconnect_max_delay_sec:  10.0

# ── Servo node (PCA9685 PWM -- 25kgcm digital servos, real BOM hardware;
#    Dynamixel kept as a selectable backend for any future Dynamixel HW) ──────
# Corrected joint topology (was wrongly assumed 7-servo two-arm Dynamixel;
# real BOM is a single right arm + 2-DOF head, elbow/wrist/head-tilt only
# -- shoulder and head-pan are NEMA17 steppers, see stepper_node below):
#   1 = HEAD_TILT (up/down)      -- published alone on the "neck" topics
#   2 = RIGHT_ELBOW
#   3 = RIGHT_WRIST                -- 2,3 published together on "arm" topics
servo_node:
  ros__parameters:
    driver_mode:   "mock"
    backend:       "mock"        # "mock" | "pca9685" (real) | "dynamixel"
    data_rate_hz:  20.0
    # Dynamixel-only:
    port:          "/dev/ttyUSB1"
    baudrate:      57600
    # PCA9685-only -- I2C address 0x40 is the chip default (A0-A5 unbridged):
    i2c_bus:       1
    i2c_address:   0x40
    pwm_freq_hz:   50.0
    servo_ids:            [1, 2, 3]
    primary_servo_id:     1
    pca9685_channels:      [0, 1, 2]
    pca9685_min_pulse_us:  [1000.0, 1000.0, 1000.0]
    pca9685_max_pulse_us:  [2000.0, 2000.0, 2000.0]
    reconnect_max_attempts:   3
    reconnect_base_delay_sec: 1.0
    reconnect_max_delay_sec:  15.0

# ── Stepper node (NEMA17 closed-loop -- HEAD pan L/R, RIGHT ARM shoulder) ──────
# The ONE actuator class in this BOM with a genuine closed-loop fault
# signal (ALM/stall) -- see bonbon_hal/drivers/stepper/nema17_closed_loop_driver.py.
# Pin numbers below are BCM GPIO placeholders -- MUST be verified against
# the physical Pi-3 wiring during bring-up, not assumed correct.
#   1 = HEAD_PAN (left/right)
#   2 = RIGHT_SHOULDER
stepper_node:
  ros__parameters:
    driver_mode:      "mock"
    backend:          "mock"        # "mock" | "nema17" (real)
    data_rate_hz:     20.0
    stepper_ids:      [1, 2]
    steps_per_rev:    200
    microstepping:    8
    max_step_rate_hz: 1500.0
    step_pins:        [20, 22]
    dir_pins:         [21, 23]
    enable_pins:      [24, 25]
    alarm_pins:       [26, 27]
    reconnect_max_attempts:   3
    reconnect_base_delay_sec: 1.0
    reconnect_max_delay_sec:  15.0

# ── Motor node (Cytron SmartDrive MDDS30 -- Rhino 24V 60RPM 100W wheel motors) ─
motor_node:
  ros__parameters:
    driver_mode:   "mock"
    data_rate_hz:  20.0
    port:          "/dev/ttyUSB2"
    baudrate:      115200
    max_speed_mps: 1.0
    reconnect_max_attempts:   5
    reconnect_base_delay_sec: 1.0
    reconnect_max_delay_sec:  15.0

# ── Battery node (INA226) ─────────────────────────────────────────────────────
battery_node:
  ros__parameters:
    driver_mode:   "mock"
    data_rate_hz:  1.0
    i2c_bus:       1
    i2c_addr:      0x40       # A0=GND, A1=GND
    shunt_ohm:     0.01       # 10 mΩ shunt resistor
    capacity_ah:   40.0       # 40 Ah LiPo
    reconnect_max_attempts:   5
    reconnect_base_delay_sec: 2.0
    reconnect_max_delay_sec:  30.0

# ── Microphone node (ReSpeaker v2.0) ─────────────────────────────────────────
mic_node:
  ros__parameters:
    driver_mode:   "mock"
    data_rate_hz:  16.0       # 16 chunks/s × 1024 samples = 16 kHz
    sample_rate:   16000
    channels:      1
    chunk_frames:  1024
    reconnect_max_attempts:   5
    reconnect_base_delay_sec: 1.0
    reconnect_max_delay_sec:  20.0

# ── Speaker node (ALSA) ───────────────────────────────────────────────────────
speaker_node:
  ros__parameters:
    driver_mode:   "mock"
    data_rate_hz:  1.0
    volume_pct:    80.0
    alsa_device:   "default"
    amixer_control: "Master"
    # PAM8610 amp mute-pin control -- OFF by default (see
    # docs/HARDWARE_SOFTWARE_GAP_REPORT.md item 4). Enable only after
    # confirming the mute pin is GPIO-wired on real Pi-2 hardware.
    has_pam8610: false
    pam8610_mute_pin: 23
    pam8610_mute_active_low: true
    reconnect_max_attempts:   3
    reconnect_base_delay_sec: 1.0
    reconnect_max_delay_sec:  15.0

# ── E-stop node (GPIO) ────────────────────────────────────────────────────────
estop_hal_node:
  ros__parameters:
    driver_mode:   "mock"     # ALWAYS "real" on physical hardware
    data_rate_hz:  50.0       # 20 ms polling interval
    input_pin:     17         # BCM GPIO 17 (active LOW)
    relay_pin:     18         # BCM GPIO 18 (active HIGH = cut power)
    poll_hz:       50.0
    reconnect_max_attempts:   10
    reconnect_base_delay_sec: 0.5
    reconnect_max_delay_sec:  5.0
