object_intelligence_node:
  ros__parameters:
    publish_rate_hz: 10.0
    health_rate_hz: 1.0
    vision_stale_timeout_sec: 1.0

    # ObjectPermanenceTracker (see core/object_permanence_tracker.py)
    occlusion_grace_sec: 2.0
    memory_grace_sec: 15.0
    max_objects: 50

    # ObjectConfidenceCalibrator — adjustment hook, NOT a fitted statistical
    # model (no labeled calibration dataset exists in this repo).
    rejection_threshold: 0.3
    small_object_area_px: 900.0
    small_object_confidence_floor: 0.35

    # Depth association fallback (used only when bonbon_vision hasn't
    # populated DetectedObject.position_3d itself) — keep in sync with the
    # active camera driver's hfov_deg.
    camera_hfov_deg: 60.0

    # OCR is off by default — MockOCRBackend never fabricates text; only
    # enable once a real backend is wired in.
    enable_ocr: false

    # LowConfidenceObjectHandler — a published (calibration-passed)
    # detection below this is never treated as actionable on its own.
    actionable_confidence_threshold: 0.6

    # PiObjectInferenceScheduler — Pi frame-rate + bounded-queue policy,
    # independent of the camera's raw rate. Defaults match
    # config/pi_perception_profile.yaml's object_detection entry.
    target_fps: 8.0
    bounded_queue_size: 2
