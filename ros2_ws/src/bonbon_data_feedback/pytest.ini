[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; Local (non-colcon-built) test runs need bonbon_data_stores and
; bonbon_perception_efficiency on sys.path directly, since FeedbackStore
; reuses SQLiteConnection/SchemaMigrator and the node reuses
; BoundedInferenceQueue rather than duplicating them. Under a real colcon
; build all packages are installed into the same environment and this is
; redundant but harmless.
pythonpath = . ../bonbon_data_stores ../bonbon_perception_efficiency
