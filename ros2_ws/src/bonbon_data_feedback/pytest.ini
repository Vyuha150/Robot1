[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; Local (non-colcon-built) test runs need bonbon_data_stores on sys.path
; directly, since FeedbackStore reuses its SQLiteConnection/SchemaMigrator
; rather than duplicating them. Under a real colcon build both packages are
; installed into the same environment and this is redundant but harmless.
pythonpath = . ../bonbon_data_stores
