[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . tests/scenarios bonbon_behavior_validation bonbon_field_learning
markers =
    unit: pure-Python unit test, no I/O
    integration: exercises more than one module together
    simulation: runs against bonbon_simulation or a scripted replay harness
    hardware_gated: requires real hardware; SKIPs off-hardware, must not fake PASS
    pi_gated: requires a running Raspberry Pi
    ai_hat_gated: requires a real Hailo AI HAT
    safety: exercises the Safety Supervisor / e-stop path
    hri: human-robot interaction (gesture, fusion) behavior
    perception: object/person detection and tracking
    speech: speech recognition / speaker diarization
    dashboard: operator dashboard / API behavior
    degraded_mode: degraded-mode trigger/recovery behavior
    performance: latency/throughput/resource-usage assertions
    field_pilot: field pilot data collection / learning loop
