family: pi_ai_hat_runtime
scenarios:
- scenario_id: BB-AIHAT-PRESENT-INSTALLED-HEFOK-NORMAL-001
  family: pi_ai_hat_runtime
  category: ai_hat_gated
  risk_level: HIGH
  input_conditions:
    environment: office_reception
    lighting: bright
    people: one_person
    gesture: none
    speech: silent
    robot_state: idle
    sensor: normal
    extra:
      hat_presence: present
      hailort_state: installed
      model_format: hef_valid
  expected_behavior: RuntimeSelector picks the correct runtime for hat=present, hailort=installed,
    model=hef_valid
  required_safety_response: fallback_active reported honestly; never reports mock
    as a real accelerator
  dashboard_update: /ai-runtime/status reflects selected_kind and fallback reason
  pass_criteria: selected runtime matches the priority chain given the injected availability
  fail_criteria: wrong runtime selected, or a fallback misreported as the requested
    accelerator
  mock_strategy: partial_mock
  hardware_requirement: ai_hat
  metrics_to_capture:
  - ai_runtime_selection_accuracy
  - ai_runtime_fallback_honesty_rate
