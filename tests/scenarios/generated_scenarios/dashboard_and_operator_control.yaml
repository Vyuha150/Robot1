family: dashboard_and_operator_control
scenarios:
- scenario_id: BB-DASH-IDLE-CONN-AUTH-001
  family: dashboard_and_operator_control
  category: dashboard
  risk_level: MEDIUM
  input_conditions:
    environment: office_reception
    lighting: bright
    people: one_person
    gesture: none
    speech: silent
    robot_state: idle
    sensor: normal
    extra:
      connection: connected
      permission: authorized
  expected_behavior: dashboard reflects idle accurately over a connected link
  required_safety_response: a disconnected dashboard never blocks the robot's own
    safety path
  dashboard_update: this family is the dashboard under test
  pass_criteria: endpoint_reflects_backend_state(); unauthorized action rejected with
    403
  fail_criteria: stale/fake data shown, or an unauthorized action succeeds
  mock_strategy: full_mock
  hardware_requirement: none
  metrics_to_capture:
  - dashboard_accuracy_rate
