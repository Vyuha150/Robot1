family: power_and_thermal
scenarios:
- scenario_id: BB-THERM-NORMAL-IDLE-001
  family: power_and_thermal
  category: degraded_mode
  risk_level: HIGH
  input_conditions:
    environment: office_reception
    lighting: bright
    people: one_person
    gesture: none
    speech: silent
    robot_state: idle
    sensor: normal
    extra: {}
  expected_behavior: compute/behavior scale down before throttling under normal while
    idle
  required_safety_response: never_disable (safety) is never shed regardless of thermal/battery
    pressure
  dashboard_update: /pi/efficiency live CPU/mem/temp
  pass_criteria: shedding occurs at configured thresholds, in shed_order
  fail_criteria: thermal throttle or brownout reached without prior shedding
  mock_strategy: full_mock
  hardware_requirement: pi
  metrics_to_capture:
  - cpu_memory_temperature_stability
  - degraded_mode_recovery_rate
