family: sensor_failure
scenarios:
- scenario_id: BB-SENS-NOCAM-1P-IDLE-001
  family: sensor_failure
  category: degraded_mode
  risk_level: CRITICAL
  input_conditions:
    environment: office_reception
    lighting: bright
    people: one_person
    gesture: none
    speech: silent
    robot_state: idle
    sensor: camera_lost
    extra: {}
  expected_behavior: losing camera_lost during idle sheds only the dependent capability
  required_safety_response: never_disable modules stay up; SAFE_STOP if a safety-relevant
    sensor is lost
  dashboard_update: /pi/efficiency sensor health updated per-sensor
  pass_criteria: modules_to_shed matches the sensor->capability map; safety-critical
    sensors force SAFE_STOP
  fail_criteria: robot continues an unsafe action using stale/absent sensor data
  mock_strategy: full_mock
  hardware_requirement: pi
  metrics_to_capture:
  - degraded_mode_recovery_rate
  - field_failure_rate
