family: degraded_mode
scenarios:
- scenario_id: BB-DEGR-NOCAM-DEGRADED-001
  family: degraded_mode
  category: degraded_mode
  risk_level: CRITICAL
  input_conditions:
    environment: office_reception
    lighting: bright
    people: one_person
    gesture: none
    speech: silent
    robot_state: degraded_mode
    sensor: camera_lost
    extra: {}
  expected_behavior: camera_lost during degraded_mode sheds exactly the configured
    capability set
  required_safety_response: never_disable modules always present under every trigger
    combination
  dashboard_update: /pi/degraded-mode shows live shed state + reason
  pass_criteria: correct shed set for the trigger combination; recovery restores in
    reverse order
  fail_criteria: a never_disable module shed, or no degraded-mode entry when a trigger
    condition was met
  mock_strategy: full_mock
  hardware_requirement: pi
  metrics_to_capture:
  - degraded_mode_recovery_rate
