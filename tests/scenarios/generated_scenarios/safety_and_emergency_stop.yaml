- scenario_id: BB-ESTOP-IDLE-1P-NORMAL-001
  family: safety_and_emergency_stop
  category: safety
  risk_level: CRITICAL
  input_conditions:
    environment: office_reception
    lighting: bright
    people: one_person
    gesture: none
    speech: silent
    robot_state: idle
    sensor: normal
    extra: {}
  expected_behavior: an e-stop/unsafe-command trigger during idle with normal is handled
