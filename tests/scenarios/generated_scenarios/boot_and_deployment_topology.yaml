family: boot_and_deployment_topology
scenarios:
- scenario_id: BB-BOOT-FRESH-MONO-001
  family: boot_and_deployment_topology
  category: integration
  risk_level: CRITICAL
  input_conditions:
    environment: office_reception
    lighting: bright
    people: one_person
    gesture: none
    speech: silent
    robot_state: idle
    sensor: normal
    extra:
      boot_mode: fresh_install
      topology: monolithic
  expected_behavior: boot reaches a valid topology (monolithic) under fresh_install
  required_safety_response: exactly one safety_supervisor_node; SAFE_STOP if none
    present
  dashboard_update: /validation/scenario-families boot_and_deployment_topology marked
    with this run's verdict
  pass_criteria: classify_topology() != INVALID and observed_safety_supervisors ==
    1
  fail_criteria: INVALID topology or observed_safety_supervisors != 1
  mock_strategy: full_mock
  hardware_requirement: pi
  metrics_to_capture:
  - boot_topology_pass_rate
